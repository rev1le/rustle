[package]
name = "rustle"
version = "0.1.0"
edition = "2024"
description = "Disk space analyzer with multi-level AI classification"
license = "MIT"

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
walkdir = "2.5"
ignore = "0.4"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1.5"
sled = "0.34"
dirs = "5"
reqwest = { version = "0.12", features = [
  "blocking",
  "json",
], default-features = false }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
arboard = "3"

[features]
default = []
llm = []

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
