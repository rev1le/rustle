[package]
name = "rustle"
version = "0.1.0"
edition = "2024"
description = "Disk space analyzer with multi-level AI classification"
license = "MIT"

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
# Обход файловой системы
walkdir = "2.5"
ignore = "0.4"

# Параллелизм
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Прогресс-бары
indicatif = "0.17"

# TUI (Этап 4 — опционально)
ratatui = "0.28"
crossterm = "0.28"

# Сериализация и конфиг
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Хэширование (для кэша ответов LLM и поиска дубликатов)
blake3 = "1.5"

# Встроенная KV-БД для кэша классификаций (Этап 3)
sled = "0.34"

# Расположение кэша по умолчанию (OS-specific cache dir)
dirs = "5"

# Локальная LLM (Этап 3) — клиент к Ollama API
reqwest = { version = "0.12", features = [
  "blocking",
  "json",
], default-features = false, optional = true }

# Логирование
log = "0.4"
env_logger = "0.11"

# Работа с временем
chrono = { version = "0.4", features = ["serde"] }

# Обработка ошибок
anyhow = "1"
thiserror = "1"

# Буфер обмена (копирование пути в TUI)
arboard = "3"

[features]
default = []
# Включить интеграцию с локальной LLM (Ollama)
llm = ["dep:reqwest"]

[dev-dependencies]
# Временные каталоги для тестов кэша
tempfile = "3"

# Дисциплина линтинга (Chapter 2.5): clippy::all включён на уровне пакета.
[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
